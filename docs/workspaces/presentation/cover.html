<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Roboto+Mono:wght@400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #FFFFFF;
            position: relative;
            font-family: 'Roboto Mono', monospace;
            color: #495665;
            overflow: hidden;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        /* 12-column visible grid lines */
        .grid-lines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(6, 1fr);
            pointer-events: none;
            z-index: 1;
        }

        .grid-cell {
            border-right: 1px solid #E5E7EB;
            border-bottom: 1px solid #E5E7EB;
        }

        /* Content containers aligned to grid */
        .content-wrapper {
            grid-column: 2 / 12;
            grid-row: 2 / 6;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 1px solid #0A192F;
            padding-left: 40px;
            position: relative;
        }

        .content-wrapper::before {
            content: '';
            position: absolute;
            left: -1px;
            top: 0;
            width: 20px;
            height: 1px;
            background-color: #0A192F;
        }

        .content-wrapper::after {
            content: '';
            position: absolute;
            left: -1px;
            bottom: 0;
            width: 20px;
            height: 1px;
            background-color: #0A192F;
        }

        h1 {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 72px;
            color: #0A192F;
            line-height: 1.1;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        h2 {
            font-size: 24px;
            font-weight: 400;
            color: #FF5A36;
            margin-bottom: 60px;
            line-height: 1.4;
        }

        .meta-info {
            font-size: 16px;
            color: #495665;
            border-top: 1px solid #E5E7EB;
            padding-top: 20px;
            display: inline-block;
        }

        .accent-box {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: calc(100% / 12 * 2);
            height: calc(100% / 6 * 2);
            background-color: #FF5A36;
            z-index: 0;
            opacity: 0.1;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grid-lines" id="grid"></div>

        <div class="accent-box"></div>

        <div class="content-wrapper">
            <h1>Living Manus–Zapier<br>Documentation<br>Workspaces</h1>
            <h2>Three coordinated workstreams, one evidence-driven operating model</h2>
            <div class="meta-info">
                Prepared by Manus AI &nbsp; | &nbsp; 18 August 2026
            </div>
        </div>
    </div>

    <script>
        // Generate grid cells
        const grid = document.getElementById('grid');
        for (let i = 0; i < 72; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            grid.appendChild(cell);
        }
    </script>
</body>
</html>
